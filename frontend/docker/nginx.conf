server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (TanStack Router) — always fall back to index.html
    # so refreshing on e.g. /trips/abc123 doesn't 404 against nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
