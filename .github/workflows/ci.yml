name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    strategy:
      matrix:
        service: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
        working-directory: ${{ matrix.service }}
      - run: npm run lint
        working-directory: ${{ matrix.service }}
      - run: npm test --if-present
        working-directory: ${{ matrix.service }}
      - run: npm run build
        working-directory: ${{ matrix.service }}
